name: 4D code scanning
description: Analyze repository-relative 4D sources and upload complete SARIF to GitHub.
inputs:
  config:
    description: Optional configuration path relative to the checked-out repository root.
    required: false
    default: ""
  category:
    description: Stable, unique code-scanning category for this analysis scope.
    required: false
    default: sonar-4d
  native-tool:
    description: Optional absolute tool4d executable path on a compatible, trusted runner.
    required: false
    default: ""
  download-tool4d:
    description: Download and verify the pinned public runtime on macOS ARM64 or Windows x64; no login or activation.
    required: false
    default: "false"
  project:
    description: .4DProject path relative to the repository root; required for either native mode.
    required: false
    default: ""
  native-timeout:
    description: Native observation deadline in seconds.
    required: false
    default: "15"
  leave-unopened:
    description: Optional newline-separated repository-relative sources for native unopened-file experiments.
    required: false
    default: ""
  dependencies:
    description: >-
      Native mode only. "install" (default) resolves dependencies.json GitHub components into the
      analysis copy; "offline" reuses verified archives only; "none" leaves declared dependencies incomplete.
    required: false
    default: install
  experimental-linux:
    description: >-
      "true" allows native analysis on Linux x86-64 (ubuntu-latest), an experimental platform: tool4d is pinned by
      SHA-256 only (4D ships no Linux signature) and results are marked experimental in analysis.json.
    required: false
    default: "false"
  cache-dependencies:
    description: >-
      Native mode, GitHub-hosted runners only: keep the verified dependency archives and the project's last
      lock between runs with actions/cache, so releases are not downloaded again and "offline" can work.
    required: false
    default: "true"
  github-token:
    description: >-
      Optional token for GitHub dependency releases (private repositories and rate limits).
      Use a fine-grained read-only token; it is passed only to the pinned dependency script.
    required: false
    default: ""
outputs:
  sarif-file:
    description: Complete SARIF report path on the runner.
    value: ${{ steps.analyze.outputs.sarif-file }}
  analysis-file:
    description: Common analysis report path on the runner.
    value: ${{ steps.analyze.outputs.analysis-file }}
  sarif-id:
    description: GitHub's uploaded SARIF identifier.
    value: ${{ steps.upload.outputs.sarif-id }}
  dependencies-cache-hit:
    description: '"true" when the dependency cache was restored for the exact key, "false" otherwise.'
    value: ${{ steps.dependency-cache.outputs.cache-hit || 'false' }}
runs:
  using: composite
  steps:
    - name: Validate native mode
      shell: bash
      env:
        DOWNLOAD_TOOL4D: ${{ inputs.download-tool4d }}
        NATIVE_TOOL: ${{ inputs.native-tool }}
        PROJECT: ${{ inputs.project }}
        LEAVE_UNOPENED: ${{ inputs.leave-unopened }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        CACHE_DEPENDENCIES: ${{ inputs.cache-dependencies }}
        EXPERIMENTAL_LINUX: ${{ inputs.experimental-linux }}
      run: |
        case "$EXPERIMENTAL_LINUX" in
          true|false) ;;
          *) echo "::error::experimental-linux must be true or false"; exit 2 ;;
        esac
        case "$CACHE_DEPENDENCIES" in
          true|false) ;;
          *) echo "::error::cache-dependencies must be true or false"; exit 2 ;;
        esac
        case "$DEPENDENCIES" in
          install|offline|none) ;;
          *) echo "::error::dependencies must be install, offline or none"; exit 2 ;;
        esac
        case "$DOWNLOAD_TOOL4D" in
          true|false) ;;
          *) echo "::error::download-tool4d must be true or false"; exit 2 ;;
        esac
        if [[ "$DOWNLOAD_TOOL4D" == true && -n "$NATIVE_TOOL" ]]; then
          echo "::error::Choose download-tool4d or native-tool, not both"
          exit 2
        fi
        native=false
        if [[ "$DOWNLOAD_TOOL4D" == true || -n "$NATIVE_TOOL" ]]; then native=true; fi
        if [[ "$native" == true && -z "$PROJECT" ]]; then
          echo "::error::Native analysis requires a project"
          exit 2
        fi
        if [[ "$native" == false && ( -n "$PROJECT" || -n "$LEAVE_UNOPENED" ) ]]; then
          echo "::error::project and leave-unopened require native analysis"
          exit 2
        fi
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Provision public tool4d
      id: provision
      if: inputs.download-tool4d == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        EXPERIMENTAL_LINUX: ${{ inputs.experimental-linux }}
      run: |
        runtime_parent="$(mktemp -d "$RUNNER_TEMP/sonar4d-tool.XXXXXX")"
        experimental=()
        if [[ "$EXPERIMENTAL_LINUX" == true ]]; then experimental=(--experimental); fi
        python -m sonar4d.provision --destination "$runtime_parent/runtime" "${experimental[@]}" > "$runtime_parent/provenance.json"
        tool_path="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["toolPath"])' "$runtime_parent/provenance.json")"
        echo "tool-path=$tool_path" >> "$GITHUB_OUTPUT"
    - name: Prepare the dependency cache
      id: dependency-cache-settings
      if: >-
        inputs.project != '' && inputs.dependencies != 'none' && inputs.cache-dependencies == 'true'
        && (inputs.download-tool4d == 'true' || inputs.native-tool != '')
        && runner.environment == 'github-hosted'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SONAR4D_PROJECT: ${{ inputs.project }}
        DOWNLOAD_TOOL4D: ${{ inputs.download-tool4d }}
      run: |
        python - <<'PY'
        import json, os
        from pathlib import Path
        from sonar4d import dependencies, provision
        build = provision.RUNTIME_VERSION if os.environ["DOWNLOAD_TOOL4D"] == "true" else "custom tool4d"
        settings = dependencies.cache_settings(Path(os.environ["GITHUB_WORKSPACE"], os.environ["SONAR4D_PROJECT"]), build)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"enabled={str(settings['enabled']).lower()}\n")
            output.write(f"prefix={settings['prefix']}\n")
            output.write("paths<<SONAR4D_PATHS\n" + "\n".join(settings["paths"]) + "\nSONAR4D_PATHS\n")
        print(json.dumps(settings))
        PY
    - name: Restore the dependency cache
      id: dependency-cache
      if: steps.dependency-cache-settings.outputs.enabled == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.dependency-cache-settings.outputs.paths }}
        key: >-
          ${{ steps.dependency-cache-settings.outputs.prefix }}${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('**/Project/Sources/dependencies.json', '**/environment4d.json') }}
        restore-keys: |
          ${{ steps.dependency-cache-settings.outputs.prefix }}${{ runner.os }}-${{ runner.arch }}-
    - name: Analyze 4D sources
      id: analyze
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SONAR4D_CONFIG: ${{ inputs.config }}
        SONAR4D_NATIVE_TOOL: ${{ steps.provision.outputs.tool-path || inputs.native-tool }}
        SONAR4D_PROJECT: ${{ inputs.project }}
        SONAR4D_NATIVE_TIMEOUT: ${{ inputs.native-timeout }}
        SONAR4D_LEAVE_UNOPENED: ${{ inputs.leave-unopened }}
        SONAR4D_DEPENDENCIES: ${{ inputs.dependencies }}
        SONAR4D_EXPERIMENTAL_LINUX: ${{ inputs.experimental-linux }}
        SONAR4D_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        report_parent="$(mktemp -d "$RUNNER_TEMP/sonar4d.XXXXXX")"
        report_dir="$report_parent/report"
        args=("$GITHUB_WORKSPACE" --output "$report_dir")
        if [[ -n "$SONAR4D_CONFIG" ]]; then
          args+=(--config "$GITHUB_WORKSPACE/$SONAR4D_CONFIG")
        fi
        if [[ -n "$SONAR4D_NATIVE_TOOL" ]]; then
          args+=(--native-tool "$SONAR4D_NATIVE_TOOL")
          if [[ "$SONAR4D_EXPERIMENTAL_LINUX" == true ]]; then args+=(--experimental-platform); fi
        fi
        if [[ -n "$SONAR4D_PROJECT" ]]; then
          args+=(--project "$SONAR4D_PROJECT")
          case "$SONAR4D_DEPENDENCIES" in
            offline) args+=(--offline-dependencies) ;;
            none) args+=(--no-dependencies) ;;
          esac
        fi
        args+=(--native-timeout "$SONAR4D_NATIVE_TIMEOUT")
        while IFS= read -r source; do
          if [[ -n "$source" ]]; then args+=(--leave-unopened "$source"); fi
        done <<< "$SONAR4D_LEAVE_UNOPENED"
        python -m sonar4d.ci "${args[@]}"
        echo "sarif-file=$report_dir/findings.sarif" >> "$GITHUB_OUTPUT"
        echo "analysis-file=$report_dir/analysis.json" >> "$GITHUB_OUTPUT"
    - name: Upload complete SARIF
      id: upload
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.analyze.outputs.sarif-file }}
        checkout_path: ${{ github.workspace }}
        category: ${{ inputs.category }}
        wait-for-processing: "true"
