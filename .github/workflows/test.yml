name: Foundation contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyzer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    env:
      SONAR4D_REQUIRE_SCHEMA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install jsonschema
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install --no-deps .
      - run: sonar-4d --version
  sonar-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -f sonar-plugin/pom.xml clean verify
