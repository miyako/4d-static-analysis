name: Hosted native 4D code scanning

on:
  push:
    branches-ignore: [main]
    paths:
      - action.yml
      - sonar4d/**
      - scripts/verify_code_scanning.py
      - tests/fixtures/**
      - tests/test_provision.py
      - tests/test_tool4d.py
      - .github/sonar4d-native-*.json
      - .github/workflows/native-code-scanning.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # macOS keeps its original categories so existing alerts keep their history.
        include:
          - fixture: errors
            os: macos-15
            category: sonar-4d-native-errors
            project: tests/fixtures/native/Project/Probe.4DProject
            unopened: |
              tests/fixtures/native/Project/Sources/Methods/Unopened.4dm
              tests/fixtures/native/Project/Sources/Methods/Callee.4dm
          - fixture: clean
            os: macos-15
            category: sonar-4d-native-clean
            project: tests/fixtures/native-clean/Project/Clean.4DProject
            unopened: ""
          - fixture: errors
            os: windows-latest
            category: sonar-4d-native-errors-windows
            project: tests/fixtures/native/Project/Probe.4DProject
            unopened: |
              tests/fixtures/native/Project/Sources/Methods/Unopened.4dm
              tests/fixtures/native/Project/Sources/Methods/Callee.4dm
          - fixture: clean
            os: windows-latest
            category: sonar-4d-native-clean-windows
            project: tests/fixtures/native-clean/Project/Clean.4DProject
            unopened: ""
          # Experimental: Linux x86-64 (opt-in, SHA-256 pin only). Judged against the macOS/Windows expectations.
          - fixture: errors
            os: ubuntu-latest
            category: sonar-4d-native-errors-linux
            experimental: "true"
            project: tests/fixtures/native/Project/Probe.4DProject
            unopened: |
              tests/fixtures/native/Project/Sources/Methods/Unopened.4dm
              tests/fixtures/native/Project/Sources/Methods/Callee.4dm
          - fixture: clean
            os: ubuntu-latest
            category: sonar-4d-native-clean-linux
            experimental: "true"
            project: tests/fixtures/native-clean/Project/Clean.4DProject
            unopened: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install tool4d's Linux libraries (experimental)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libfreeimage3 libc++1-18 libc++abi1-18 libunwind-18
      - name: Analyze with public tool4d
        id: analyze
        uses: ./
        with:
          download-tool4d: "true"
          project: ${{ matrix.project }}
          config: .github/sonar4d-native-${{ matrix.fixture }}.json
          leave-unopened: ${{ matrix.unopened }}
          native-timeout: "60"
          category: ${{ matrix.category }}
          experimental-linux: ${{ matrix.experimental || 'false' }}
      - name: Show tool4d's observation after a Linux failure (experimental)
        if: failure() && runner.os == 'Linux'
        run: |
          for f in "$RUNNER_TEMP"/*/native-observation.json "$RUNNER_TEMP"/*/report/native-observation.json; do
            [ -f "$f" ] || continue
            echo "== $f"
            python - "$f" <<'PY'
          import json, sys
          o = json.load(open(sys.argv[1]))
          print(json.dumps({k: o.get(k) for k in ("version", "complete", "reason", "processExitCode", "events")}, indent=2))
          for k in ("stdoutTail", "stderrTail"):
              print(f"--- {k}:"); print((o.get(k) or "")[-6000:])
          PY
          done
      - name: Record the Linux runtime (experimental)
        if: runner.os == 'Linux'
        env:
          ANALYSIS_FILE: ${{ steps.analyze.outputs.analysis-file }}
        run: |
          { lsb_release -ds; ldd --version | head -1; } || true
          python - "$ANALYSIS_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          analysis = json.loads(Path(sys.argv[1]).read_text())
          observation = json.loads((Path(sys.argv[1]).parent / "native-observation.json").read_text())
          print(json.dumps({"complete": analysis["complete"], "experimental": analysis.get("experimental"),
                            "version": observation.get("version"), "reason": observation.get("reason"),
                            "findings": [(f["path"], f["start_line"], f["message"]) for f in analysis["findings"]]},
                           indent=2, ensure_ascii=False))
          PY
      - name: Verify native diagnostics and GitHub processing
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
          ANALYSIS_FILE: ${{ steps.analyze.outputs.analysis-file }}
          FIXTURE: ${{ matrix.fixture }}
        run: |
          python -m scripts.verify_code_scanning \
            --sarif-id "$SARIF_ID" \
            --analysis-file "$ANALYSIS_FILE" \
            --native-fixture "$FIXTURE" \
            --output "$RUNNER_TEMP/native-github-evidence.json"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: native-github-evidence-${{ matrix.fixture }}-${{ matrix.os }}
          path: ${{ runner.temp }}/native-github-evidence.json
          if-no-files-found: error
  missing-dependency:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tool4d's Linux libraries (experimental)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libfreeimage3 libc++1-18 libc++abi1-18 libunwind-18
      - name: Provision public tool4d
        run: |
          experimental=()
          if [[ "$RUNNER_OS" == Linux ]]; then experimental=(--experimental); echo "SONAR4D_EXPERIMENTAL=--experimental-platform" >> "$GITHUB_ENV"; fi
          python -m sonar4d.provision --destination "$RUNNER_TEMP/tool4d-runtime" "${experimental[@]}" > "$RUNNER_TEMP/provenance.json"
          python -c 'import json, sys; print("TOOL4D=" + json.load(open(sys.argv[1]))["toolPath"])' "$RUNNER_TEMP/provenance.json" >> "$GITHUB_ENV"
      - name: Require genuine dependency failure, not a clean scan
        run: |
          status=0
          python -m sonar4d . \
            --config .github/sonar4d-native-missing.json \
            --native-tool "$TOOL4D" $SONAR4D_EXPERIMENTAL \
            --project tests/fixtures/missing-dependency/Project/MissingDependency.4DProject \
            --native-timeout 60 \
            --output "$RUNNER_TEMP/missing-dependency-report" || status=$?
          if [[ "$status" != 2 ]]; then
            echo "::error::Missing dependency must produce incomplete analysis (exit 2)"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "missing-dependency-report"
          report = json.loads((root / "analysis.json").read_text())
          assert report["complete"] is False
          assert report["errors"] == ["Declared 4D dependencies are incomplete: AbsentComponent: local component with no path was not found or not resolved"]
          assert not (root / "sonar-issues.json").exists()
          assert len(report["findings"]) == 1
          finding = report["findings"][0]
          assert finding["start_line"] == 2 and finding["rule_id"] == "4D-N001"
          assert "cs.AbsentComponent is unknown" in finding["message"]
          print("Actual missing-component diagnostic preserved; no successful import report generated.")
          PY
          git diff --exit-code
      - name: Show tool4d's observation after a Linux failure (experimental)
        if: failure() && runner.os == 'Linux'
        run: |
          for f in "$RUNNER_TEMP"/*/native-observation.json "$RUNNER_TEMP"/*/report/native-observation.json; do
            [ -f "$f" ] || continue
            echo "== $f"
            python - "$f" <<'PY'
          import json, sys
          o = json.load(open(sys.argv[1]))
          print(json.dumps({k: o.get(k) for k in ("version", "complete", "reason", "processExitCode", "events")}, indent=2))
          for k in ("stdoutTail", "stderrTail"):
              print(f"--- {k}:"); print((o.get(k) or "")[-6000:])
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-missing-dependency-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/missing-dependency-report/analysis.json
          if-no-files-found: error

  action-dependency-cache:
    # Runs the action on a project with a GitHub dependency. The first run of a key saves the cache; a rerun
    # (or a later push with the same manifests) restores it, as `dependencies-cache-hit` shows.
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Analyze with dependencies installed through the action
        id: analyze
        uses: ./
        with:
          download-tool4d: "true"
          project: tests/fixtures/github-dependencies/Project/GitHubDependencies.4DProject
          config: .github/sonar4d-native-dependencies.json
          native-timeout: "60"
          github-token: ${{ github.token }}
          category: sonar-4d-native-dependencies
      - name: Check the installation and report the cache
        env:
          ANALYSIS_FILE: ${{ steps.analyze.outputs.analysis-file }}
          CACHE_HIT: ${{ steps.analyze.outputs.dependencies-cache-hit }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          analysis = Path(os.environ["ANALYSIS_FILE"])
          assert json.loads(analysis.read_text())["complete"] is True
          summary = json.loads((analysis.parent / "native-observation.json").read_text())["dependencies"]
          assert summary["installed"] == ["4D SVG"], summary
          print("dependencies-cache-hit:", os.environ["CACHE_HIT"], json.dumps(summary))
          PY
          test -d "$HOME/Library/Caches/miyako-4d-dependencies/archives/github"
          test -d "$HOME/Library/Caches/sonar-4d/scripts"
          git diff --exit-code

  github-dependencies:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tool4d's Linux libraries (experimental)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libfreeimage3 libc++1-18 libc++abi1-18 libunwind-18
      - name: Provision public tool4d
        run: |
          experimental=()
          if [[ "$RUNNER_OS" == Linux ]]; then experimental=(--experimental); echo "SONAR4D_EXPERIMENTAL=--experimental-platform" >> "$GITHUB_ENV"; fi
          python -m sonar4d.provision --destination "$RUNNER_TEMP/tool4d-runtime" "${experimental[@]}" > "$RUNNER_TEMP/provenance.json"
          python -c 'import json, sys; print("TOOL4D=" + json.load(open(sys.argv[1]))["toolPath"])' "$RUNNER_TEMP/provenance.json" >> "$GITHUB_ENV"
      - name: Install GitHub dependencies, then reuse them offline
        env:
          SONAR4D_GITHUB_TOKEN: ${{ github.token }}
        run: |
          for mode in online offline; do
            flags=()
            if [[ "$mode" == offline ]]; then flags=(--offline-dependencies); unset SONAR4D_GITHUB_TOKEN; fi
            python -m sonar4d.ci . "${flags[@]}" \
              --config .github/sonar4d-native-dependencies.json \
              --native-tool "$TOOL4D" $SONAR4D_EXPERIMENTAL \
              --project tests/fixtures/github-dependencies/Project/GitHubDependencies.4DProject \
              --native-timeout 60 \
              --output "$RUNNER_TEMP/dependencies-$mode"
            MODE="$mode" python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / f"dependencies-{os.environ['MODE']}"
          report = json.loads((root / "analysis.json").read_text())
          assert report["complete"] is True, report["errors"]
          assert not [f for f in report["findings"] if f["rule_id"].startswith("4D-N")], report["findings"]
          summary = json.loads((root / "native-observation.json").read_text())["dependencies"]
          assert summary["installed"] == ["4D SVG"], summary
          if os.environ["MODE"] == "offline":
              assert summary["reuse"] == {"4D SVG": "verified archive"}, summary
          print(json.dumps(summary))
          PY
          done
          test ! -e tests/fixtures/github-dependencies/Project/Components
          git diff --exit-code
      - name: Show tool4d's observation after a Linux failure (experimental)
        if: failure() && runner.os == 'Linux'
        run: |
          for f in "$RUNNER_TEMP"/*/native-observation.json "$RUNNER_TEMP"/*/report/native-observation.json; do
            [ -f "$f" ] || continue
            echo "== $f"
            python - "$f" <<'PY'
          import json, sys
          o = json.load(open(sys.argv[1]))
          print(json.dumps({k: o.get(k) for k in ("version", "complete", "reason", "processExitCode", "events")}, indent=2))
          for k in ("stdoutTail", "stderrTail"):
              print(f"--- {k}:"); print((o.get(k) or "")[-6000:])
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-github-dependencies-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/dependencies-*/native-observation.json
          if-no-files-found: error
